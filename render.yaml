services:
  - type: web
    name: line-rangers-guildwar
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/guildwar.sqlite
    disk:
      name: guildwar-data
      mountPath: /var/data
      sizeGB: 1
