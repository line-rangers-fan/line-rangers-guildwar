name: Refresh weekly PvP snapshots
on:
  schedule:
    # Saturday 05:00 Japan time (UTC+9).
    - cron: '0 20 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guildwar-weekly-pvp
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data/pvp-weekly
          path: pvp-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/update-pvp-snapshot.mjs
      - name: Save successful snapshots
        working-directory: pvp-snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pvp-cache/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh weekly PvP snapshots'
            git push origin HEAD:data/pvp-weekly
          fi

