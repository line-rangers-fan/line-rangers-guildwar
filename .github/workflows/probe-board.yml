name: Probe board storage compatibility
on:
  pull_request:
    paths: ['.github/workflows/probe-board.yml', 'scripts/probe-board.mjs']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe-board.mjs
