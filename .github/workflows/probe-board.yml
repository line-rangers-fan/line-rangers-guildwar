name: Probe board storage compatibility
on:
  pull_request:
    paths: ['.github/workflows/probe-board.yml', 'scripts/probe-board.mjs']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data/pvp-weekly
          path: pvp-snapshot
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/probe-board.mjs
      - name: Save recovered snapshots
        working-directory: pvp-snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pvp-cache/
          if ! git diff --cached --quiet; then
            git commit -m 'Recover missing PvP snapshots'
            git push origin HEAD:data/pvp-weekly
          fi
