name: Verify weekly PvP source retry (temporary)
on:
  pull_request:
    paths: ['.github/workflows/weekly-live-test.yml', 'scripts/check-pvp-weekly-live.mjs']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pvp-weekly-live.mjs
